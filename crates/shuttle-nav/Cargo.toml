# shuttle-nav — the daemonless "specialized LSP" query layer (docs/shuttle_lsp_capability_plan.md §9).
# The ONLY new engine position: it does not re-index. It composes shuttle-symbols'
# SymbolTable (definitions), extract_references (candidate refs) and
# genuine_identifier_lines/disambiguate_refs (AST disambiguation) into
# references/rename/impls/callers/hover, and emits one unified NavHit model with
# an explicit High/Medium/Low confidence per hit. No LSP protocol, no server.

