name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.90.0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.coordinates.outputs.source_commit }}
      source_epoch: ${{ steps.coordinates.outputs.source_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y universal-ctags zstd
          cargo install ast-grep --locked
      - id: version
        run: |
          version="$(python3 release/release_version.py --tag "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: coordinates
        run: |
          source_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$source_commit"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$(python3 release/release_version.py --tag "$RELEASE_TAG" --source-epoch)" >> "$GITHUB_OUTPUT"
      - run: |
          make release-test
          make release-gate

  binaries:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: ./release/build-release-binary.sh "${{ matrix.target }}" dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  linux-binaries:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./release/export-linux-binaries.sh dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: dist/release/*.tar.gz
          if-no-files-found: error

  container:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "ref=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: digest
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCKER_DIGEST_FILE: dist/container.digest
          SHUTTLE_TOOLS_DIST: dist/release
        run: |
          ./release/docker-release.sh push "${{ steps.image.outputs.ref }}"
          echo "digest=$(cat dist/container.digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-tools-and-containers
          path: |
            dist/release/shuttle-tools-v*
            dist/container-images.json
          if-no-files-found: error

  publish:
    needs: [preflight, binaries, linux-binaries, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          export CONTAINER_IMAGES_FILE="$(find dist/artifacts -name container-images.json -print -quit)"
          test -n "$CONTAINER_IMAGES_FILE"
          ./release/assemble-from-artifacts.sh dist/artifacts dist/release
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: ./release/publish-release.sh github dist/release
